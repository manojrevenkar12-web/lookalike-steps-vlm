# The held-out customer station, written before any result and run once (`lsv heldout`). Tighter slots, a tool
# pair closer in colour, a longer standard work and a different bench.
seed: heldout-2026
seconds: 60
pretrain: {stations: 8, recordings: 5, slot_gap: [7, 10], tool_colours: [[[0.85, 0.50, 0.10], [0.35, 0.45, 0.70]], [[0.80, 0.20, 0.20], [0.30, 0.60, 0.40]], [[0.90, 0.75, 0.15], [0.45, 0.35, 0.65]]], housing: [[0.78, 0.78, 0.76], [0.70, 0.74, 0.80]]}
customer:
  name: H1
  slot_gap: 5
  tool_colours: [[0.55, 0.30, 0.65], [0.50, 0.35, 0.55]]
  housing: [0.80, 0.68, 0.55]
  labelled: 4
  validation: 1
  unlabelled: 8
  test: 3
standard_work_pool:
  - [pick_housing, place_housing, insert_clip, pick_screw, fasten_a, pick_screw, fasten_b, torque_a, unload]
  - [pick_housing, place_housing, pick_screw, fasten_a, torque_a, insert_clip, inspect, unload]
  - [pick_housing, place_housing, insert_clip, inspect, remove_clip, pick_screw, fasten_b, pick_screw, fasten_a, unload]
  - [pick_housing, place_housing, pick_screw, fasten_b, pick_screw, fasten_a, torque_a, insert_clip, unload]
customer_standard_work: [pick_housing, place_housing, pick_screw, fasten_b, torque_a, pick_screw, fasten_a, torque_a, insert_clip, inspect, remove_clip, insert_clip, unload]
durations: {pick_housing: 1.4, place_housing: 1.4, pick_screw: 1.0, fasten_a: 2.0, fasten_b: 2.0, torque_a: 1.6, insert_clip: 1.5, remove_clip: 1.5, inspect: 2.0, unload: 1.4, idle_between_cycles: [0.4, 2.5]}
worker_speed: [0.75, 1.3]
duration_jitter: 0.25
deviations: {skip: 0.1, swap: 0.08, pause: 0.1}
conditions:
  normal:   {rotation_deg: [-5, 5], scale: [0.93, 1.07], shift: [-3, 3], gain: [0.85, 1.15], noise: [0.01, 0.025], passers_per_minute: [0, 0], variant: false}
  camera:   {rotation_deg: [-25, 25], scale: [0.8, 1.2], shift: [-7, 7], gain: [0.85, 1.15], noise: [0.01, 0.025], passers_per_minute: [0, 0], variant: false}
  lighting: {rotation_deg: [-5, 5], scale: [0.93, 1.07], shift: [-3, 3], gain: [0.45, 1.6], noise: [0.03, 0.07], passers_per_minute: [0, 0], variant: false}
  busy:     {rotation_deg: [-5, 5], scale: [0.93, 1.07], shift: [-3, 3], gain: [0.85, 1.15], noise: [0.01, 0.025], passers_per_minute: [4, 8], variant: false}
  variant:  {rotation_deg: [-5, 5], scale: [0.93, 1.07], shift: [-3, 3], gain: [0.85, 1.15], noise: [0.01, 0.025], passers_per_minute: [0, 0], variant: true}
