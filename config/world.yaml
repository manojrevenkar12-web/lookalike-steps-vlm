# The dev world. Pretraining stations stand for the many stations a base model has seen; the customer station is
# the one being onboarded, with few labelled recordings. Coordinates are in a 96 x 96 bench seen by a 64 x 64 camera.
seed: dev-2026
seconds: 60
pretrain:
  stations: 8
  recordings: 5
  slot_gap: [7, 10]          # distance between screw slots a and b; smaller is harder
  tool_colours:              # driver and torque wrench, drawn per station
    - [[0.85, 0.50, 0.10], [0.35, 0.45, 0.70]]
    - [[0.80, 0.20, 0.20], [0.30, 0.60, 0.40]]
    - [[0.90, 0.75, 0.15], [0.45, 0.35, 0.65]]
  housing: [[0.78, 0.78, 0.76], [0.70, 0.74, 0.80]]
customer:
  name: C1
  slot_gap: 6
  tool_colours: [[0.20, 0.55, 0.85], [0.25, 0.40, 0.60]]   # a blue driver and a blue-grey wrench: never seen in pretraining
  housing: [0.62, 0.70, 0.62]
  labelled: 4                # labelled recordings for fine-tuning (curves use 1, 2, 4)
  validation: 1
  unlabelled: 8              # recordings for distillation, no labels
  test: 3                    # per condition
standard_work_pool:
  - [pick_housing, place_housing, insert_clip, pick_screw, fasten_a, pick_screw, fasten_b, torque_a, unload]
  - [pick_housing, place_housing, pick_screw, fasten_a, torque_a, insert_clip, inspect, unload]
  - [pick_housing, place_housing, insert_clip, inspect, remove_clip, pick_screw, fasten_b, pick_screw, fasten_a, unload]
  - [pick_housing, place_housing, pick_screw, fasten_b, pick_screw, fasten_a, torque_a, insert_clip, unload]
customer_standard_work: [pick_housing, place_housing, insert_clip, pick_screw, fasten_a, pick_screw, fasten_b, torque_a, inspect, remove_clip, insert_clip, unload]
durations:                   # seconds for an average worker
  pick_housing: 1.4
  place_housing: 1.4
  pick_screw: 1.0
  fasten_a: 2.2
  fasten_b: 2.2
  torque_a: 1.8
  insert_clip: 1.6
  remove_clip: 1.6
  inspect: 2.0
  unload: 1.4
  idle_between_cycles: [0.4, 2.5]
worker_speed: [0.8, 1.25]
duration_jitter: 0.2
deviations: {skip: 0.08, swap: 0.06, pause: 0.08}
conditions:                  # recording conditions: camera, light, people walking past, a product variant
  normal:   {rotation_deg: [-4, 4], scale: [0.95, 1.05], shift: [-2, 2], gain: [0.9, 1.1], noise: [0.01, 0.02], passers_per_minute: [0, 0], variant: false}
  camera:   {rotation_deg: [-22, 22], scale: [0.82, 1.18], shift: [-6, 6], gain: [0.9, 1.1], noise: [0.01, 0.02], passers_per_minute: [0, 0], variant: false}
  lighting: {rotation_deg: [-4, 4], scale: [0.95, 1.05], shift: [-2, 2], gain: [0.5, 1.5], noise: [0.03, 0.06], passers_per_minute: [0, 0], variant: false}
  busy:     {rotation_deg: [-4, 4], scale: [0.95, 1.05], shift: [-2, 2], gain: [0.9, 1.1], noise: [0.01, 0.02], passers_per_minute: [3, 6], variant: false}
  variant:  {rotation_deg: [-4, 4], scale: [0.95, 1.05], shift: [-2, 2], gain: [0.9, 1.1], noise: [0.01, 0.02], passers_per_minute: [0, 0], variant: true}
